apiVersion: apps/v1
kind: Deployment
metadata:
  name: pro4-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pro4
  template:
    metadata:
      labels:
        app: pro4
    spec:
      containers:
        - name: pro4
          image: mertsoker/pro4:latest
          ports:
            - containerPort: 8081